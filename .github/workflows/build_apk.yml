name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_check:
    name: Contrôle Qualité (Analyse & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
        working-directory: lupus_arena

      - name: Tests unitaires critiques de non-régression
        run: flutter test
        working-directory: lupus_arena

  build:
    name: Compilation Multi-ABI & Release
    needs: quality_check
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        working-directory: lupus_arena

      - name: Prepare Release Assets Directory
        run: mkdir -p release_assets
        working-directory: lupus_arena

      - name: Build Universal APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/LupusArena.apk
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit, 64-bit, x86_64)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/LupusArena-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/LupusArena-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/LupusArena-x86_64.apk
          echo "=== Taille des APKs générés ==="
          ls -lh release_assets/
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: lupus_arena/release_assets/LupusArena*.apk

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            TAG="v$RAW_VER"
          fi
          echo "APP_VERSION=$TAG" >> $GITHUB_ENV
          echo "Building version: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Lupus Arena ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }} (Boutons d'Accueil Gothiques · Plage de Saisie Code Salon Interactive · Migration Firebase & Package com.ghdinteractivestudio.lupusarena · i18n FR/AR/EN)

            #### 🌟 Nouveautés & Améliorations de cette Release

            **🏰 Refonte Visuelle de l'Écran d'Accueil (Lobby Screen)**
            - Intégration fidèle des assets gothiques de haute qualité (`UI LOBBY`) selon la composition officielle `DESPOSITION.jpg`.
            - Plaques de pierre gravées avec emblèmes sculptés et alignement millimétré sous la poutre Lupus Arena :
              • Bouton de gauche : *CRÉE UN SALON* avec tête de loup arcanique violette et animation de compression tactile (scale 0.93) au toucher.
              • Plaque centrale : *CODE SALON* transformée en véritable plage de texte interactive (`TextField`) intégrée à la pierre, avec typographie luminescente violette (`#F3E8FF` / `#C084FC`), passage automatique en majuscules et hint contextuel.
              • Bouton de droite : *REJOINDRE* avec double tête de loup et portail ouvert, validant la saisie pour entrer dans le salon.

            **🔥 Migration Firebase & Unification du Package**
            - Basculement complet sur le nouveau projet Firebase `lupusarena` (ID `1050312347949`) avec Realtime Database `europe-west1`.
            - Harmonisation intégrale du package name `com.ghdinteractivestudio.lupusarena` sur toute l'arborescence Android, Gradle et configurations clientes.

            **🌐 Internationalisation & Localisation Complète**
            - Support intégral et symétrique de 3 langues : Français (FR), Arabe (AR) et Anglais (EN) sans aucune clé manquante.

            ---
            #### 📲 Binaires Téléchargeables
            * **`LupusArena.apk`** — Universel (recommandé)
            * **`LupusArena-arm64.apk`** — 64-bit (smartphones récents)
            * **`LupusArena-arm32.apk`** — 32-bit (anciens smartphones)
            * **`LupusArena-x86_64.apk`** — x86_64 (émulateurs)
          draft: false
          prerelease: false
          files: |
            lupus_arena/release_assets/LupusArena.apk
            lupus_arena/release_assets/LupusArena-arm64.apk
            lupus_arena/release_assets/LupusArena-arm32.apk
            lupus_arena/release_assets/LupusArena-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
