name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_check:
    name: Contrôle Qualité (Analyse & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
        working-directory: lupus_arena

      - name: Tests unitaires critiques de non-régression
        run: flutter test
        working-directory: lupus_arena

  build:
    name: Compilation Multi-ABI & Release
    needs: quality_check
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        working-directory: lupus_arena

      - name: Prepare Release Assets Directory
        run: mkdir -p release_assets
        working-directory: lupus_arena

      - name: Build Universal APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/LupusArena.apk
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit, 64-bit, x86_64)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/LupusArena-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/LupusArena-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/LupusArena-x86_64.apk
          echo "=== Taille des APKs générés ==="
          ls -lh release_assets/
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: lupus_arena/release_assets/LupusArena*.apk

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            TAG="v$RAW_VER"
          fi
          echo "APP_VERSION=$TAG" >> $GITHUB_ENV
          echo "Building version: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Lupus Arena ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }} (Deck Officiel · Gestion Audio & Mute · Partage Multilingue · Élimination des Drapeaux)

            #### 🌟 Nouveautés & Améliorations de cette Release

            **🃏 Refactorisation Complète des Cartes (Deck Officiel)**
            - Remplacement intégral de l'ancien jeu de cartes par la nouvelle collection officielle dans `assets/cards/`.
            - Suppression définitive de l'ancien dossier obsolète `LOUP GAROU ENHANCED/`.
            - Mappages stricts et gestion robuste de toutes les cartes (Servante Dévouée, Chevalier à l'Épée Rouillée, Grand Méchant Loup, etc.).
            - Dos de carte officiel harmonisé (`assets/cards/Fond.jpg`).

            **🎵 Gestion Sonore & Coexistence Parfaite avec Agora RTC**
            - Pistes dédiées en boucle continue :
              • Lobby : *Aldeas de Niebla* avec fondu (*fade-out*) à l'entrée dans la Room.
              • Room (en jeu) : *Village at Night* avec volume subtil (18%) préservant les échanges vocaux.
            - Coexistence RTC avancée : `AndroidAudioFocus.none` et `mixWithOthers` pour ne jamais couper ni interférer avec le chat vocal.
            - Suppression de tout retour micro : activation forcée de l'AEC (*Acoustic Echo Cancellation*), AGC et NS sur Agora.
            - Bouton Mute Musique dédié (`MusicMuteButton`), 100% indépendant d'Agora (ne coupe jamais le micro ni les voix des joueurs).

            **🖼️ Nouveau Fond d'Écran du Lobby**
            - Intégration du fond officiel (`lobby screen.jpg` / `lobby_screen.jpg` / `backlobby.jpg`).
            - Résolution dynamique sur smartphone avec fallback cascade élégant.

            **📲 Partage Natif du Code de Room (Multilingue FR / EN / AR)**
            - Nouveau bouton de partage `Icons.share` immédiatement à côté du bouton de copie du code.
            - Messages d'invitation dynamiques selon la langue du joueur (Arabe, Français, Anglais).
            - Support popover iPad/tablettes via `sharePositionOrigin` calculé sur le `RenderBox`.

            **🏳️ Élimination Complète des Drapeaux dans l'UI**
            - Retrait intégral de tous les drapeaux dans les sélecteurs de langue et boîtes de dialogue.
            - Affichage épuré basé exclusivement sur les codes textuels (`FR`, `AR`, `EN`) et les noms des langues.

            ---
            #### 📲 Binaires Téléchargeables
            * **`LupusArena.apk`** — Universel (recommandé)
            * **`LupusArena-arm64.apk`** — 64-bit (smartphones récents)
            * **`LupusArena-arm32.apk`** — 32-bit (anciens smartphones)
            * **`LupusArena-x86_64.apk`** — x86_64 (émulateurs)
          draft: false
          prerelease: false
          files: |
            lupus_arena/release_assets/LupusArena.apk
            lupus_arena/release_assets/LupusArena-arm64.apk
            lupus_arena/release_assets/LupusArena-arm32.apk
            lupus_arena/release_assets/LupusArena-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
