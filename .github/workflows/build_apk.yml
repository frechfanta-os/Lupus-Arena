name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_check:
    name: Contrôle Qualité (Analyse & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
        working-directory: lupus_arena

      - name: Tests unitaires critiques de non-régression
        run: flutter test
        working-directory: lupus_arena

  build:
    name: Compilation Multi-ABI & Release
    needs: quality_check
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        working-directory: lupus_arena

      - name: Prepare Release Assets Directory
        run: mkdir -p release_assets
        working-directory: lupus_arena

      - name: Build Universal APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/LupusArena.apk
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit, 64-bit, x86_64)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/LupusArena-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/LupusArena-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/LupusArena-x86_64.apk
          echo "=== Taille des APKs générés ==="
          ls -lh release_assets/
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: lupus_arena/release_assets/LupusArena*.apk

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            TAG="v$RAW_VER"
          fi
          echo "APP_VERSION=$TAG" >> $GITHUB_ENV
          echo "Building version: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Lupus Arena ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }} (Correctif Agora Voice RTC · Cycle de Vie Audio · Clavier & Fond Fixe · i18n Réactif FR/AR/EN)

            #### 🌟 Nouveautés & Correctifs de cette Release

            **🎙️ Rétablissement Complet du Chat Vocal Agora RTC**
            - Correction de la configuration d'authentification RTC : restauration du certificat d'application et du générateur de jeton 006 HMAC-SHA256 (`AgoraTokenBuilder`).
            - Résolution définitive du blocage "ERREUR AUDIO AGORA" et amélioration de la reprise manuelle (`retryJoin`) pour rejoindre instantanément les canaux vocaux (`lupus_$roomCode`).

            **🎵 Gestion Intelligente du Cycle de Vie Audio (Sortie d'application & Veille)**
            - La musique de jeu et d'ambiance se coupe automatiquement et proprement lorsque l'application passe en arrière-plan, est minimisée (`hidden`, `paused`, `inactive`) ou quittée via le bouton retour (`PopScope`).
            - Reprise automatique et fluide de la piste appropriée au retour au premier plan (`resumed`).

            **⌨️ Disposition Optimale du Clavier Virtuel**
            - Alignement dynamique et élégant de la barre d'action juste au-dessus du clavier lors de la saisie du code salon, sans déformation du fond d'écran (`resizeToAvoidBottomInset: false`).

            **🌐 Réactivité Immédiate de la Localisation**
            - Rendu dynamique des libellés de boutons dans toutes les langues supportées (Français, Arabe, Anglais) avec rafraîchissement instantané lors du changement de langue.

            ---
            #### 📲 Binaires Téléchargeables
            * **`LupusArena.apk`** — Universel (recommandé)
            * **`LupusArena-arm64.apk`** — 64-bit (smartphones récents)
            * **`LupusArena-arm32.apk`** — 32-bit (anciens smartphones)
            * **`LupusArena-x86_64.apk`** — x86_64 (émulateurs)
          draft: false
          prerelease: false
          files: |
            lupus_arena/release_assets/LupusArena.apk
            lupus_arena/release_assets/LupusArena-arm64.apk
            lupus_arena/release_assets/LupusArena-arm32.apk
            lupus_arena/release_assets/LupusArena-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
