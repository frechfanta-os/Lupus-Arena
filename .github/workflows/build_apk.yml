name: Build Play Store AAB & Release Assets

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_check:
    name: Contrôle Qualité (Analyse & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
        working-directory: lupus_arena

      - name: Tests unitaires
        run: flutter test
        working-directory: lupus_arena

  build:
    name: Compilation Google Play Bundle (AAB) & APKs
    needs: quality_check
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        working-directory: lupus_arena

      - name: Setup Android Keystore for Play Store signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
storePassword=$KEYSTORE_PASSWORD
keyPassword=$KEY_PASSWORD
keyAlias=$KEY_ALIAS
storeFile=upload-keystore.jks
EOF
          else
            echo "Avertissement: KEYSTORE_BASE64 non défini dans les secrets, utilisation du keystore par défaut."
          fi
        working-directory: lupus_arena

      - name: Prepare Release Assets Directory
        run: |
          mkdir -p release_assets
          mkdir -p build/app/outputs/symbols
        working-directory: lupus_arena

      # Construction du format requis par Google Play Console : Android App Bundle (.aab)
      - name: Build Google Play Bundle (AAB)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/bundle/release/app-release.aab release_assets/LupusArena-release.aab
          
          # Archivage des symboles de désobfuscation à soumettre à Google Play
          if [ -d "build/app/outputs/symbols" ] && [ "$(ls -A build/app/outputs/symbols 2>/dev/null)" ]; then
            cd build/app/outputs/symbols && zip -r ../../../../release_assets/symbols.zip . && cd ../../../..
          else
            touch release_assets/empty_symbols.txt
            cd release_assets && zip symbols.zip empty_symbols.txt && rm empty_symbols.txt && cd ..
          fi
        working-directory: lupus_arena

      # Construction optionnelle des APKs autonomes pour les testeurs directs et la release GitHub
      - name: Build Split-per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/LupusArena-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/LupusArena-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/LupusArena-x86_64.apk
          echo "=== Fichiers prêts pour distribution ==="
          ls -lh release_assets/
        working-directory: lupus_arena

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: google-play-bundle-and-apks
          path: |
            lupus_arena/release_assets/*.aab
            lupus_arena/release_assets/*.apk
            lupus_arena/release_assets/symbols.zip

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            TAG="v$RAW_VER"
          fi
          echo "APP_VERSION=$TAG" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Lupus Arena ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }}

            #### 📦 Fichiers Play Console & Binaires
            * **`LupusArena-release.aab`** : Fichier à uploader directement sur la console Google Play.
            * **`symbols.zip`** : Fichier de symboles natifs/Dart pour les stacktraces désobfusquées.
            * **APKs découpés par ABI** : Pour tests manuels sans passer par le store (`arm64`, `arm32`, `x86_64`).
          draft: false
          prerelease: false
          files: |
            lupus_arena/release_assets/LupusArena-release.aab
            lupus_arena/release_assets/symbols.zip
            lupus_arena/release_assets/LupusArena-arm64.apk
            lupus_arena/release_assets/LupusArena-arm32.apk
            lupus_arena/release_assets/LupusArena-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
