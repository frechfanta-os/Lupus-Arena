name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_check:
    name: Contrôle Qualité (Analyse & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
        working-directory: lupus_arena

      - name: Tests unitaires critiques de non-régression
        run: flutter test
        working-directory: lupus_arena

  build:
    name: Compilation Multi-ABI & Release
    needs: quality_check
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"
        working-directory: lupus_arena

      - name: Install dependencies
        run: flutter pub get
        working-directory: lupus_arena

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        working-directory: lupus_arena

      - name: Prepare Release Assets Directory
        run: mkdir -p release_assets
        working-directory: lupus_arena

      - name: Build Universal APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/LupusArena.apk
        working-directory: lupus_arena

      - name: Build Split-per-ABI APKs (32-bit, 64-bit, x86_64)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/LupusArena-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/LupusArena-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/LupusArena-x86_64.apk
          echo "=== Taille des APKs générés ==="
          ls -lh release_assets/
        working-directory: lupus_arena

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupus-arena-apks
          path: lupus_arena/release_assets/LupusArena*.apk

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' lupus_arena/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            TAG="v$RAW_VER"
          fi
          echo "APP_VERSION=$TAG" >> $GITHUB_ENV
          echo "Building version: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Lupus Arena ${{ env.APP_VERSION }}"
          body: |
            ### 🐺 Lupus Arena - ${{ env.APP_VERSION }} (Continuité Audio en Jeu · Nettoyage Permissions Play Store · Deck Officiel · Partage Multilingue)

            #### 🌟 Nouveautés & Améliorations de cette Release

            **🎵 Maintien Continu de la Musique en Jeu & Mixage Audio Optimal**
            - Correction de la coupure de la musique *Village at Night* lors du passage du salon d'attente à la partie en cours : suppression de l'arrêt prématuré dans le cycle de vie du lobby et renforcement du monitoring de reprise dans l'arène de jeu.
            - Configuration de l'AudioContext en mode `AndroidUsageType.game` garantissant la coexistence et le mixage matériel natif sans atténuation ni coupure avec la VoIP Agora RTC.
            - Pistes dédiées en boucle continue :
              • Lobby : *Aldeas de Niebla* avec fondu (*fade-out*) à l'entrée dans la Room.
              • Room (attente et en cours de jeu) : *Village at Night* avec volume subtil (18%) préservant la clarté des échanges vocaux.
            - Bouton Mute Musique dédié (`MusicMuteButton`), 100% indépendant d'Agora (ne coupe jamais le micro ni les voix des joueurs).

            **🛡️ Nettoyage des Permissions & Conformité Google Play Store**
            - Élimination des permissions superflues ou bloquantes pour le Google Play Store :
              • Retrait de `REQUEST_INSTALL_PACKAGES` (interdit sur le Play Store pour les apps standard).
              • Retrait de `READ_PHONE_STATE` (permission sensible restreinte).
              • Retrait de `READ_EXTERNAL_STORAGE` et `READ_MEDIA_AUDIO` ainsi que `requestLegacyExternalStorage` (les fichiers audio sont gérés en assets et cache applicatif interne).
            - Conservation exclusive des permissions essentielles à Agora RTC, au réseau et aux accessoires : `INTERNET`, `RECORD_AUDIO`, `MODIFY_AUDIO_SETTINGS`, `ACCESS_NETWORK_STATE`, `BLUETOOTH_CONNECT`, `WAKE_LOCK`.

            **🃏 Deck Officiel & Graphismes**
            - Remplacement intégral de l'ancien jeu de cartes par la collection officielle dans `assets/cards/`.
            - Nouveau fond d'écran officiel du Lobby (`lobby screen.jpg` / `lobby_screen.jpg` / `backlobby.jpg`).

            **📲 Partage Natif du Code de Room & UI Multilingue Épurée**
            - Bouton de partage natif `Icons.share` avec messages d'invitation dynamiques multilingues (Arabe, Français, Anglais) et support iPad.
            - Retrait intégral de tous les drapeaux dans l'interface au profit d'un affichage textuel épuré (`FR`, `AR`, `EN`).

            ---
            #### 📲 Binaires Téléchargeables
            * **`LupusArena.apk`** — Universel (recommandé)
            * **`LupusArena-arm64.apk`** — 64-bit (smartphones récents)
            * **`LupusArena-arm32.apk`** — 32-bit (anciens smartphones)
            * **`LupusArena-x86_64.apk`** — x86_64 (émulateurs)
          draft: false
          prerelease: false
          files: |
            lupus_arena/release_assets/LupusArena.apk
            lupus_arena/release_assets/LupusArena-arm64.apk
            lupus_arena/release_assets/LupusArena-arm32.apk
            lupus_arena/release_assets/LupusArena-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
