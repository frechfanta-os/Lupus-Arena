<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lupus Arena — Aperçu du Lobby Flutter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background-color: #080b12;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Viewport simulant un smartphone */
    .viewport-wrapper {
      position: relative;
      width: 100%;
      max-width: 412px;
      height: 890px;
      max-height: 95vh;
      background: #000;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,215,0,0.25);
      border-radius: 36px;
      display: flex;
      flex-direction: column;
    }

    /* Image de fond identique à LupusAssets.lobbyBackdropAsset */
    .backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      z-index: 1;
    }

    /* Stack principal */
    .lobby-container {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 2;
      padding: env(safe-area-inset-top, 24px) 18px env(safe-area-inset-bottom, 24px) 18px;
    }

    /* ── TOP BAR ── */
    .top-bar {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding-top: 14px;
    }

    /* Capsule Profil — Logo officiel tête de loup 28x28 + Pseudo (sans crayon) */
    .profile-capsule {
      display: flex;
      align-items: center;
      background: rgba(18, 24, 46, 0.80);
      border: 0.8px solid rgba(212, 175, 55, 0.6);
      border-radius: 10px;
      padding: 3.5px 10px 3.5px 4px;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(212, 175, 55, 0.12);
      gap: 7px;
      transition: transform 0.15s ease;
    }
    .profile-capsule:active { transform: scale(0.96); }

    .avatar-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }
    .pseudo-text {
      font-family: serif;
      font-size: 11px;
      font-weight: 800;
      color: #D4AF37;
      letter-spacing: 0.8px;
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Groupe droite */
    .top-right-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Pilule MAJ — thème sombre runique, liseré émeraude */
    .update-pill {
      display: flex;
      align-items: center;
      background: rgba(13, 31, 26, 0.80);
      border: 0.9px solid rgba(52, 211, 153, 0.7);
      border-radius: 10px;
      padding: 4px 8px;
      cursor: pointer;
      box-shadow: 0 1px 6px rgba(16, 185, 129, 0.25);
      font-size: 10px;
      font-weight: 800;
      color: #ffffff;
      gap: 4px;
      transition: transform 0.15s ease;
    }
    .update-pill:active { transform: scale(0.96); }
    .badge-new {
      background: #10B981;
      color: #fff;
      font-size: 7px;
      font-weight: 900;
      padding: 1px 4px;
      border-radius: 5px;
      letter-spacing: 0.5px;
    }

    /* Globe — IDENTIQUE au HUD de l'Arena (32×32, arcaneGold) */
    .globe-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(12, 18, 38, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: #D4AF37;
      transition: transform 0.15s ease;
    }
    .globe-btn:active { transform: scale(0.94); }

    /* ── BOUTONS D'ACTION (Positioned bottom: 110px — Emplacement exact du "X", au-dessus du cercle runique) ── */
    .action-buttons-container {
      position: absolute;
      bottom: 110px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .action-btn {
      width: 144px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.7px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.87);
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      outline: none;
      border: none;
      text-decoration: none;
      white-space: nowrap;
      padding: 0 8px;
    }
    .action-btn:active { transform: scale(0.97); filter: brightness(1.15); }

    /* Bouton 1 : CRÉER UN SALON (Obsidienne violacée + néon améthyste + liseré or/bronze ciselé + lune 🌙) */
    .btn-create {
      background: linear-gradient(to bottom, #5A1E8A, #2E0D4E, #16062A);
      border: 1.2px solid rgba(229, 193, 88, 0.85) !important;
      box-shadow: 0 0 10px rgba(139, 37, 199, 0.38), 0 0 4px rgba(212, 175, 55, 0.22), 0 2px 7px rgba(0, 0, 0, 0.6);
    }
    .btn-create .btn-icon {
      font-size: 13px;
      color: #FFD54F;
      filter: drop-shadow(0 0 3px rgba(255, 213, 79, 0.6));
    }

    /* Bouton 2 : CODE DU SALON (Style pierre runique sombre et sobre) */
    .code-input-wrapper {
      width: 144px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(to bottom, #1E2330, #121622, #0A0D15);
      border: 1.1px solid rgba(100, 116, 139, 0.55);
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
    }
    .code-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      color: #F1F5F9;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      caret-color: #FFD700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.87);
    }
    .code-input::placeholder {
      color: #788296;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    /* Bouton 3 : REJOINDRE (Vert spectral sombre + liseré émeraude + griffe de loup 🐾) */
    .btn-join {
      background: linear-gradient(to bottom, #14532D, #072E1B, #03190E);
      border: 1.2px solid rgba(52, 211, 153, 0.80) !important;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.35), 0 2px 7px rgba(0, 0, 0, 0.6);
    }
    .btn-join .btn-icon {
      font-size: 12px;
      color: #6EE7B7;
      filter: drop-shadow(0 0 3px rgba(110, 231, 183, 0.6));
    }

    /* ── MODALES ── */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-box {
      background: #0F1424;
      border: 1.5px solid #FFD700;
      border-radius: 20px;
      width: 100%;
      max-width: 320px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255,215,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 800;
      color: #FFD700;
      text-align: center;
    }
    .lang-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,215,0,0.3);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .lang-item:hover, .lang-item.active {
      background: rgba(255,215,0,0.15);
      border-color: #FFD700;
    }
    .modal-close-btn {
      align-self: center;
      padding: 8px 24px;
      background: #FFD700;
      color: #000;
      border-radius: 12px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
      border: none;
    }

    /* Footer info */
    .info-footer {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }
    .info-footer a { color: #FFD700; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="viewport-wrapper">
    <img class="backdrop" src="assets/images/lobby_screen.jpg" onerror="this.onerror=null;this.src='assets/images/backlobby.jpg';" alt="Lupus Arena Backdrop">

    <div class="lobby-container">

      <!-- TOP BAR — Logo loup officiel 28x28 + Pseudo (sans crayon) -->
      <div class="top-bar">
        <div class="profile-capsule" onclick="openNameModal()" title="Modifier le pseudo">
          <img src="assets/images/lupus_seal.png" alt="Lupus Logo" class="avatar-logo">
          <div class="pseudo-text" id="displayPseudo">Loup-Garou</div>
        </div>

        <div class="top-right-group">
          <div class="update-pill" onclick="alert('Lupus Arena v2.5.8 — Notes de version !')">
            <span style="font-size:11px;">🔄</span>
            <span>v2.5.8</span>
            <span class="badge-new">NEW</span>
          </div>
          <div class="globe-btn" onclick="openLangModal()" title="Changer de langue">🌐</div>
        </div>
      </div>

      <!-- BOUTONS D'ACTION — Positionnés exactement au X (bottom: 110px), au-dessus du cercle runique -->
      <div class="action-buttons-container">
        <!-- 1. CRÉER UN SALON : Mauve lunaire / Obsidienne -->
        <button class="action-btn btn-create" onclick="triggerAction('Création du salon...')">
          <span>CRÉER UN SALON</span>
        </button>

        <!-- 2. CODE DU SALON : Pierre runique sombre -->
        <div class="code-input-wrapper">
          <input type="text" class="code-input" id="roomCodeInput" maxlength="8"
                 placeholder="CODE DU SALON"
                 onkeypress="if(event.key==='Enter') triggerJoin()">
        </div>

        <!-- 3. REJOINDRE : Vert spectral sombre -->
        <button class="action-btn btn-join" onclick="triggerJoin()">
          <span>REJOINDRE</span>
        </button>
      </div>

    </div>

    <!-- Modale Langue -->
    <div class="modal-overlay" id="langModal">
      <div class="modal-box">
        <div class="modal-title">SÉLECTION DE LANGUE</div>
        <div class="lang-item active" onclick="selectLang('Français')">
          <span>Français</span><span>FR</span>
        </div>
        <div class="lang-item" onclick="selectLang('العربية')">
          <span>العربية</span><span>AR</span>
        </div>
        <div class="lang-item" onclick="selectLang('English')">
          <span>English</span><span>EN</span>
        </div>
        <button class="modal-close-btn" onclick="closeModal('langModal')">FERMER</button>
      </div>
    </div>

    <!-- Modale Pseudo -->
    <div class="modal-overlay" id="nameModal">
      <div class="modal-box">
        <div class="modal-title">MODIFIER LE PSEUDO</div>
        <input type="text" id="nameInput"
               style="width:100%; background:rgba(255,255,255,0.08); border:1px solid #FFD700; border-radius:10px; color:#fff; padding:10px; font-size:14px; outline:none; text-align:center;"
               value="Loup-Garou">
        <div style="display:flex; justify-content:space-between; gap:10px;">
          <button class="modal-close-btn" style="background:transparent; border:1px solid rgba(255,255,255,0.3); color:#fff;" onclick="closeModal('nameModal')">ANNULER</button>
          <button class="modal-close-btn" onclick="savePseudo()">VALIDER</button>
        </div>
      </div>
    </div>

  </div>

  <div class="info-footer">
    🐺 <strong>Lupus Arena Web Preview v2.5.8</strong> • Localhost <strong>:8080</strong><br>
    <a href="javascript:location.reload()">Recharger</a> pour rafraîchir.
  </div>

  <script>
    function openNameModal() {
      document.getElementById('nameInput').value = document.getElementById('displayPseudo').innerText;
      document.getElementById('nameModal').style.display = 'flex';
      setTimeout(() => document.getElementById('nameInput').focus(), 50);
    }
    function savePseudo() {
      const val = document.getElementById('nameInput').value.trim();
      if (val) document.getElementById('displayPseudo').innerText = val;
      closeModal('nameModal');
    }
    function openLangModal() {
      document.getElementById('langModal').style.display = 'flex';
    }
    function selectLang(name) {
      alert('Langue sélectionnée : ' + name);
      closeModal('langModal');
    }
    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }
    function triggerAction(msg) { alert(msg); }
    function triggerJoin() {
      const code = document.getElementById('roomCodeInput').value.trim();
      if (!code) alert('Veuillez saisir le code du salon.');
      else alert('Rejoindre le salon : ' + code.toUpperCase());
    }
  </script>
</body>
</html>
