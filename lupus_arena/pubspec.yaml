name: lupus_arena
description: "Lupus Arena Flutter App"
publish_to: 'none'
version: 2.5.19+87

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.12.0
  firebase_database: ^11.3.0
  agora_rtc_engine: ^6.3.0
  audioplayers: ^6.1.0
  flutter_riverpod: ^2.6.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.5
  crypto: ^3.0.6
  package_info_plus: ^8.1.0
  device_info_plus: ^11.1.0
  dio: ^5.7.0
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/cards/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon_full.png"
  adaptive_icon_background: "assets/images/app_icon_bg.png"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"
  min_sdk_android: 21
